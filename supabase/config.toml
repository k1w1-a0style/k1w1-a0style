# supabase/config.toml
# ------------------------------------------------------------
# SECURITY NOTE:
# - verify_jwt bleibt hier bewusst false (App nutzt aktuell kein Supabase Auth Login)
# - Schutz passiert über `x-k1w1-admin-key` (siehe _shared/auth.ts)
#   -> Wird nur erzwungen, wenn Secret `K1W1_EDGE_ADMIN_KEY` gesetzt ist.
# - Wenn du später Supabase Auth nutzt: verify_jwt = true setzen.
# ------------------------------------------------------------

[functions.trigger-eas-build]
enabled = true
verify_jwt = false
import_map = "./import_map.json"
entrypoint = "./functions/trigger-eas-build/index.ts"

[functions.check-eas-build]
enabled = true
verify_jwt = false
import_map = "./import_map.json"
entrypoint = "./functions/check-eas-build/index.ts"

