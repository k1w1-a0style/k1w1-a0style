name: Determine Checkout Ref
description: Pick a safe git ref to checkout from workflow inputs / repository_dispatch payload.
inputs:
  payload_branch:
    description: repository_dispatch client_payload.branch
    required: false
    default: ""
  payload_ref:
    description: repository_dispatch client_payload.ref
    required: false
    default: ""
  input_ref:
    description: workflow_dispatch inputs.ref
    required: false
    default: ""
  github_ref_name:
    description: github.ref_name
    required: false
    default: ""
  default_ref:
    description: Fallback ref if everything else is empty
    required: false
    default: "main"
  allowed_refs_csv:
    description: Optional comma-separated allowlist (exact branch/ref names)
    required: false
    default: ""

outputs:
  checkout_ref:
    description: The chosen ref to checkout
    value: ${{ steps.pick.outputs.checkout_ref }}

runs:
  using: "composite"
  steps:
    - id: pick
      shell: bash
      run: |
        set -euo pipefail

        REF="${{ inputs.payload_branch }}"
        if [ -z "$REF" ]; then REF="${{ inputs.payload_ref }}"; fi
        if [ -z "$REF" ]; then REF="${{ inputs.input_ref }}"; fi
        if [ -z "$REF" ]; then REF="${{ inputs.github_ref_name }}"; fi
        if [ -z "$REF" ]; then REF="${{ inputs.default_ref }}"; fi

        # Trim CR/LF (copy/paste + payload weirdness)
        REF="$(printf '%s' "$REF" | tr -d '\r\n')"

        if [ -z "$REF" ]; then
          echo "❌ Ref is empty."
          exit 1
        fi

        if [ "${#REF}" -gt 200 ]; then
          echo "❌ Ref too long."
          exit 1
        fi

        if [[ "$REF" =~ [[:cntrl:]] ]] || [[ "$REF" =~ [[:space:]] ]]; then
          echo "❌ Ref contains control/space characters."
          exit 1
        fi

        if [[ "$REF" == refs/* ]] || [[ "$REF" == -* ]]; then
          echo "❌ Ref has a forbidden prefix."
          exit 1
        fi

        if [[ "$REF" == *..* ]] || [[ "$REF" == *@\{* ]] || [[ "$REF" == *.lock ]]; then
          echo "❌ Ref contains forbidden git sequences."
          exit 1
        fi

        if [[ "$REF" == */ ]] || [[ "$REF" == *///* ]]; then
          echo "❌ Ref contains forbidden slash placement."
          exit 1
        fi

        if [[ "$REF" =~ [:\\~\^\?\*\[] ]]; then
          echo "❌ Ref contains forbidden metacharacters."
          exit 1
        fi

        if [[ ! "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
          echo "❌ Ref violates safe character policy."
          exit 1
        fi

        ALLOWED_REFS="${{ inputs.allowed_refs_csv }}"
        if [ -n "$ALLOWED_REFS" ]; then
          SAFE_MATCHED=0
          IFS=',' read -r -a TOKENS <<< "$ALLOWED_REFS"
          for RAW_TOKEN in "${TOKENS[@]}"; do
            TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n' | xargs)"
            if [ -z "$TOKEN" ]; then
              continue
            fi
            if [ "$TOKEN" = "$REF" ]; then
              SAFE_MATCHED=1
              break
            fi
          done
          if [ "$SAFE_MATCHED" -ne 1 ]; then
            echo "❌ Ref not in allowlist: $REF"
            exit 1
          fi
        fi

        if [ -z "$REF" ]; then
          echo "❌ Ref not allowed: $REF"
          exit 1
        fi

        echo "checkout_ref=$REF" >> "$GITHUB_OUTPUT"
        echo "CHECKOUT_REF=$REF"
