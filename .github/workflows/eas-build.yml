name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/SHA)"
        required: false
        default: "main"
      profile:
        description: "EAS profile (development|preview|production)"
        required: false
        default: "development"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      EAS_CLI_VERSION: 16.32.0
      CHECKOUT_REF: ${{ inputs.ref || 'main' }}
      PROFILE: ${{ inputs.profile || 'development' }}

    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --include=dev
          else
            echo "::warning::No lockfile found in repo. Falling back to npm install (non-reproducible)."
            npm install --no-audit --no-fund --include=dev
          fi

      - name: Install EAS CLI
        run: |
          set -euo pipefail
          npm i -g "eas-cli@${EAS_CLI_VERSION}"
          eas --version

      - name: Cleanup incomplete native directories
        run: |
          set -euo pipefail
          if [ -d android ] && [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "🧹 Removing incomplete android/ directory (no android/app/build.gradle)."
            rm -rf android
          fi
          if [ -d ios ] && [ ! -f ios/Podfile ]; then
            echo "🧹 Removing incomplete ios/ directory (no ios/Podfile)."
            rm -rf ios
          fi

      - name: Prepare local Android signing (non-production)
        if: ${{ env.PROFILE != 'production' }}
        run: |
          set -euo pipefail
          if ! command -v keytool >/dev/null 2>&1; then
            echo "::error::keytool not found. Install Java (JDK) on the runner."
            exit 1
          fi

          mkdir -p .eas
          KEYSTORE_PATH=".eas/ci-debug.jks"
          KEY_ALIAS="ci-debug"
          KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-$(openssl rand -hex 12)}"
          KEY_PASSWORD="${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"

          rm -f "$KEYSTORE_PATH"
          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=CI Debug, OU=CI, O=K1W1, L=CI, S=CI, C=DE" \
            -noprompt

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const profile = process.env.PROFILE || 'development';
          const file = path.join(process.cwd(), 'eas.json');
          const eas = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : {};
          eas.cli = eas.cli || {};
          eas.cli.appVersionSource = eas.cli.appVersionSource || 'remote';
          eas.build = eas.build || {};
          eas.build[profile] = eas.build[profile] || {};
          const b = eas.build[profile];
          b.distribution = b.distribution || 'internal';
          b.developmentClient = false;
          b.android = b.android || {};
          b.android.buildType = b.android.buildType || (profile === 'production' ? 'aab' : 'apk');
          b.android.credentialsSource = 'local';
          b.android.keystore = {
            keystorePath: process.env.ANDROID_KEYSTORE_PATH,
            keystorePassword: process.env.ANDROID_KEYSTORE_PASSWORD,
            keyAlias: process.env.ANDROID_KEYSTORE_ALIAS,
            keyPassword: process.env.ANDROID_KEY_PASSWORD,
          };
          fs.writeFileSync(file, JSON.stringify(eas, null, 2));
          console.log(`✅ Updated eas.json for local Android signing (profile=${profile}).`);
          NODE

      - name: Guard production build requires preconfigured credentials
        if: ${{ env.PROFILE == 'production' }}
        run: |
          set -euo pipefail
          echo "::error::PROFILE=production requires a real Android keystore configured in EAS Credentials (non-interactive CI cannot generate a new keystore)."
          echo "Run locally once: eas credentials -p android (or an interactive eas build) to generate/attach the keystore, then rerun CI."
          exit 1

      - name: Run EAS Build (WAIT)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          echo "🚀 Starting EAS build (android, profile=${PROFILE}) with --wait..."
          eas whoami
          eas build --platform android --profile "${PROFILE}" --non-interactive --wait
