name: EAS Build (Android)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS profile (development|preview|production)"
        required: false
        default: "preview"
      checkout_ref:
        description: "Git ref (branch/tag/SHA)"
        required: false
        default: "main"

permissions:
  contents: write
  metadata: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ inputs.profile || 'preview' }}"
          REF="${{ inputs.checkout_ref || 'main' }}"
          case "$PROFILE" in
            development|preview|production) ;;
            *) echo "::warning::Invalid PROFILE='$PROFILE' -> defaulting to preview"; PROFILE="preview" ;;
          esac
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "CHECKOUT_REF=$REF" >> "$GITHUB_ENV"

      - name: Validate secrets
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "::warning::No lockfile found -> npm install"
            npm install --no-audit --no-fund
          fi

      - name: Remove broken native dirs (if present)
        shell: bash
        run: |
          set -euo pipefail
          if [ -d android ] && { [ ! -f android/app/build.gradle ] || [ ! -f android/build.gradle ]; }; then
            echo "::warning::Incomplete android/ detected -> removing"
            rm -rf android
          fi
          if [ -d ios ] && [ ! -f ios/Podfile ] && [ ! -f ios/Podfile.lock ]; then
            echo "::warning::Incomplete ios/ detected -> removing"
            rm -rf ios
          fi

      - name: Setup Java (for keystore generation)
        if: env.PROFILE != 'production'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare local Android signing (non-production)
        if: env.PROFILE != 'production'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .eas/credentials
          KEYSTORE_PATH=".eas/credentials/android.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair               -storetype JKS               -keystore "$KEYSTORE_PATH"               -storepass "android"               -keypass "android"               -alias "androiddebugkey"               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

          node - <<'NODE'
          const fs = require('fs');
          const file = 'eas.json';
          let eas = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file,'utf8')) : {};
          eas.cli = eas.cli || {};
          eas.cli.appVersionSource = eas.cli.appVersionSource || 'remote';
          eas.build = eas.build || {};
          for (const profile of ['development','preview']) {
            eas.build[profile] = eas.build[profile] || {};
            eas.build[profile].android = eas.build[profile].android || {};
            eas.build[profile].android.buildType = 'apk';
            eas.build[profile].android.credentialsSource = 'local';
            eas.build[profile].android.keystore = {
              keystorePath: '.eas/credentials/android.keystore',
              keystorePassword: 'android',
              keyAlias: 'androiddebugkey',
              keyPassword: 'android',
            };
          }
          fs.writeFileSync(file, JSON.stringify(eas,null,2)+'\n');
          console.log('✅ Patched eas.json for local signing (non-production).');
          NODE

      - name: Install EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          VER="${EAS_CLI_VERSION:-16.32.0}"
          npm install -g "eas-cli@${VER}"
          eas --version

      - name: Build (android)
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${PROFILE}" = "production" ]; then
            echo "::error::Production builds are blocked in CI. Use EAS dashboard/local machine for production signing."
            exit 1
          fi
          echo "🚀 Building (android, profile=${PROFILE}) ..."
          BUILD_OUTPUT="$(eas build --platform android --profile "${PROFILE}" --non-interactive --wait 2>&1)" || {
            CODE=$?
            echo "${BUILD_OUTPUT}"
            echo "::error::EAS build failed (exit ${CODE})"
            exit "${CODE}"
          }
          echo "${BUILD_OUTPUT}"
          BUILD_ID="$(echo "${BUILD_OUTPUT}" | grep -oE "Build ID:[[:space:]]*[a-fA-F0-9-]+" | head -n1 | awk '{print $3}' || true)"
          if [ -z "${BUILD_ID}" ]; then BUILD_ID="unknown"; fi
          BUILD_URL="$(echo "${BUILD_OUTPUT}" | grep -oE "https?://[^[:space:]]+" | grep -E "/projects/[^/]+/builds/[a-fA-F0-9-]+" | head -n1 || true)"
          mkdir -p build
          printf "build_id=%s\nbuild_url=%s\nprofile=%s\nref=%s\n" "$BUILD_ID" "$BUILD_URL" "$PROFILE" "${CHECKOUT_REF}" > build/eas-build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: eas-android-${{ env.PROFILE }}
          path: build/eas-build-info.txt
          retention-days: 30
