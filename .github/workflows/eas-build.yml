name: EAS Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile (development|preview|production)"
        required: true
        default: "preview"
        type: string
      job_id:
        description: "Optional: Supabase build_jobs ID (wenn aus App getriggert)"
        required: false
        type: string

jobs:
  eas-android:
    name: Run EAS Build (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PROFILE: ${{ inputs.profile }}
      JOB_ID: ${{ inputs.job_id }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROFILE}" ]]; then
            echo "::error::profile is required"
            exit 1
          fi
          if [[ "${PROFILE}" != "development" && "${PROFILE}" != "preview" && "${PROFILE}" != "production" ]]; then
            echo "::error::Invalid profile: ${PROFILE}"
            echo "Use: development | preview | production"
            exit 1
          fi
          echo "✓ profile=${PROFILE}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Ensure EXPO_TOKEN exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: true
          eas-cache: true

      - name: Verify EAS authentication
        shell: bash
        run: |
          set -euo pipefail
          eas --version
          eas whoami

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Update build status -> building (optional)
        if: ${{ env.JOB_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "::warning::Supabase secrets missing, skipping status update."
            exit 0
          fi
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          curl --fail-with-body --silent --show-error -X PATCH "${SUPABASE_URL}/rest/v1/build_jobs?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"building\",\"github_run_id\":\"${GITHUB_RUN_ID}\",\"started_at\":\"${TS}\"}" \
            || echo "::warning::Failed to update Supabase status"

      - name: Run EAS build (WAIT)
        id: eas
        shell: bash
        run: |
          set -euo pipefail
          echo "Starting EAS cloud build (WAIT)..."
          BUILD_OUTPUT="$(eas build --platform android --profile "${PROFILE}" --non-interactive --wait 2>&1)" || {
            EXIT_CODE=$?
            echo "${BUILD_OUTPUT}"
            exit ${EXIT_CODE}
          }
          echo "${BUILD_OUTPUT}"
          BUILD_ID="$(echo "${BUILD_OUTPUT}" | grep -oP 'Build ID:\s*\K[a-fA-F0-9-]+' | head -n1 || true)"
          if [ -z "${BUILD_ID}" ]; then BUILD_ID="unknown"; fi
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

      - name: Update build status -> completed (optional)
        if: ${{ success() && env.JOB_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "::warning::Supabase secrets missing, skipping status update."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X PATCH "${SUPABASE_URL}/rest/v1/build_jobs?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"completed\",\"eas_build_id\":\"${{ steps.eas.outputs.build_id }}\"}" \
            || echo "::warning::Failed to update Supabase status"

      - name: Update build status -> error (optional)
        if: ${{ failure() && env.JOB_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "::warning::Supabase secrets missing, skipping status update."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X PATCH "${SUPABASE_URL}/rest/v1/build_jobs?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"error\"}" \
            || echo "::warning::Failed to update Supabase status"
