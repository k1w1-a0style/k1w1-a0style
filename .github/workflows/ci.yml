name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA (leer = aktueller Ref)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-core.yml
    with:
      ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
