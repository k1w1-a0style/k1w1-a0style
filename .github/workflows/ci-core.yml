name: CI Core

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch/Tag/SHA, z.B. feature/foo"
        required: true
        type: string
      node-version:
        description: "Node Version"
        required: false
        type: string
        default: "20"

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (ref aus App/Workflow)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs['node-version'] }}
          cache: npm

      - name: Install (frozen)
        run: npm ci --no-audit --no-fund

      - name: Lint (CI)
        run: npm run lint:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Edge Functions Quality Gates
        run: npm run edge:check

      - name: Tests
        run: npm run test:silent

      - name: Coverage (summary, non-blocking)
        continue-on-error: true
        run: npm run test:coverage -- --coverageReporters=text-summary --watchAll=false

      - name: Expo config smoke test (projectId present)
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install expo config --json > /tmp/expo-config.json
          PROJECT_ID="$(node -e 'const c=require("/tmp/expo-config.json"); process.stdout.write(String((c.expo ?? c)?.extra?.eas?.projectId||""))')"
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::expo.extra.eas.projectId missing."
            echo ""
            echo "--- diagnostics ---"
            echo "PWD: $(pwd)"
            echo "Has eas-project.json?"; ls -la eas-project.json || true
            echo "eas-project.json (if present):"; cat eas-project.json || true
            echo "expo config snippet:"; node -e 'const c=require("/tmp/expo-config.json"); console.log(JSON.stringify({ extra: (c.expo ?? c)?.extra }, null, 2));'
            echo ""
            echo "Fix: run the \"EAS Link / Init\" workflow (eas-link.yml) or commit eas-project.json so app.config.js can set extra.eas.projectId deterministically."
            exit 1
          fi
          echo "✅ expo.extra.eas.projectId: ${PROJECT_ID}"
