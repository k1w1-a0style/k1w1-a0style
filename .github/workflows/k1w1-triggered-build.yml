name: K1W1 Triggered EAS Build

on:
  repository_dispatch:
    types: [k1w1-triggered-build]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/SHA)"
        required: false
        default: "main"
      profile:
        description: "EAS profile (development|preview|production)"
        required: false
        default: "development"

permissions:
  contents: read

jobs:
  build_android:
    name: EAS Build (Android, WAIT)
    runs-on: ubuntu-latest
    env:
      # Keep this pinned so CI is predictable.
      EAS_CLI_VERSION: 16.32.0
      CHECKOUT_REF: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}
      PROFILE: ${{ github.event.client_payload.profile || inputs.profile || 'development' }}
      ARTIFACT_EXT: apk
      JOB_ID: ${{ github.event.client_payload.job_id || '' }}

    steps:
      - name: Validate EXPO_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund --include=dev
          else
            echo "::warning::No lockfile found -> npm install (non-reproducible)."
            npm install --no-audit --no-fund --include=dev
          fi

      - name: Install EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          npm i -g "eas-cli@${EAS_CLI_VERSION}"
          eas --version

      - name: Cleanup incomplete native directories
        shell: bash
        run: |
          set -euo pipefail
          # If android/ios exist but are incomplete, EAS treats the project as "prebuild/bare" and fails.
          if [ -d android ] && [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "🧹 Removing incomplete android/ directory (no android/app/build.gradle)."
            rm -rf android
          fi
          if [ -d ios ] && [ ! -f ios/Podfile ]; then
            echo "🧹 Removing incomplete ios/ directory (no ios/Podfile)."
            rm -rf ios
          fi

      - name: Prepare local Android keystore (non-production)
        shell: bash
        run: |
          set -euo pipefail

          if [ "${PROFILE}" = "production" ]; then
            echo "ℹ️ production profile -> expecting Android credentials to already exist on EAS (Expo server)."
            echo "If this fails with a keystore error, run once locally: eas credentials -p android (interactive)"
            exit 0
          fi

          if ! command -v keytool >/dev/null 2>&1; then
            echo "::error::keytool not found (Java missing on runner)."
            exit 1
          fi

          mkdir -p .eas/ci
          KEYSTORE_PATH=".eas/ci/k1w1-ci.jks"
          KEYSTORE_PASSWORD="k1w1-ci-pass"
          KEY_ALIAS="k1w1"
          KEY_PASSWORD="k1w1-ci-pass"

          rm -f "${KEYSTORE_PATH}"
          echo "🔐 Generating ephemeral keystore for ${PROFILE} build…"
          keytool -genkeypair \
            -storetype JKS \
            -keystore "${KEYSTORE_PATH}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            -keypass "${KEY_PASSWORD}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=K1W1 CI, OU=CI, O=K1W1, L=Berlin, S=BE, C=DE" \
            >/dev/null

          echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"

          # Patch eas.json so THIS CI build uses local credentials + APK + no dev client requirement.
          # (We don't commit back; it only affects the build upload.)
          node - <<'NODE'
          const fs = require('fs');
          const path = 'eas.json';
          const profile = process.env.PROFILE || 'development';
          const keystorePath = process.env.KEYSTORE_PATH;
          const keystorePassword = process.env.KEYSTORE_PASSWORD;
          const keyAlias = process.env.KEY_ALIAS;
          const keyPassword = process.env.KEY_PASSWORD;

          if (!fs.existsSync(path)) {
            console.error('::error::eas.json not found.');
            process.exit(1);
          }

          const eas = JSON.parse(fs.readFileSync(path, 'utf8'));
          eas.cli = eas.cli || {};
          // Removes future warning and keeps versions consistent.
          eas.cli.appVersionSource = eas.cli.appVersionSource || 'remote';

          eas.build = eas.build || {};
          eas.build[profile] = eas.build[profile] || {};
          const b = eas.build[profile];

          b.distribution = b.distribution || 'internal';
          b.developmentClient = false;
          b.android = b.android || {};
          b.android.buildType = b.android.buildType || 'apk';
          b.android.credentialsSource = 'local';
          b.android.keystore = {
            keystorePath,
            keystorePassword,
            keyAlias,
            keyPassword,
          };

          fs.writeFileSync(path, JSON.stringify(eas, null, 2) + '\n');
          console.log(`✅ Patched eas.json for profile '${profile}' -> local keystore + apk + devClient=false`);
          NODE

      - name: Run EAS Build (WAIT)
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          echo "🚀 Starting EAS build (android, profile=${PROFILE}) with --wait..."
          eas build --platform android --profile "${PROFILE}" --non-interactive --wait

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Triggered Build Summary"
            echo ""
            echo "- Repo: ${{ github.repository }}"
            echo "- Event: ${{ github.event_name }}"
            echo "- Checkout ref: ${CHECKOUT_REF}"
            echo "- Profile: ${PROFILE}"
            echo "- Commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
