name: K1W1 Triggered Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA to build"
        required: false
        default: "main"
      profile:
        description: "EAS profile (development|preview|production)"
        required: false
        default: "preview"
      job_id:
        description: "Optional job id for Supabase status updates"
        required: false
        default: ""
  repository_dispatch:
    types: [k1w1-build]

permissions:
  contents: write

jobs:
  build:
    name: EAS Build (Android, WAIT)
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_CLI_VERSION: ${{ vars.EAS_CLI_VERSION || '16.0.0' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Determine checkout ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}"
          if [ -z "$REF" ]; then REF="main"; fi
          echo "CHECKOUT_REF=$REF" >> "$GITHUB_ENV"
          echo "📌 Checkout ref: $REF"

      - name: Determine build profile + artifact extension
        id: prof
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.client_payload.profile || github.event.inputs.profile || 'preview' }}"
          case "$PROFILE" in
            development|preview|production) ;;
            *)
              echo "::warning::Invalid PROFILE='$PROFILE', defaulting to preview"
              PROFILE="preview"
              ;;
          esac
          if [ "$PROFILE" = "production" ]; then EXT="aab"; else EXT="apk"; fi
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "ARTIFACT_EXT=$EXT" >> "$GITHUB_ENV"
          echo "✅ Using build profile: $PROFILE (artifact: .$EXT)"

      - name: Validate secrets + optional JOB_ID
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

          JOB_ID="${{ github.event.client_payload.job_id || github.event.inputs.job_id || '' }}"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

          if [ -z "${JOB_ID:-}" ]; then
            echo "has_job_id=false" >> "$GITHUB_ENV"
            echo "⚠️ No JOB_ID provided -> Supabase status updates will be skipped."
          else
            if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              echo "::warning::JOB_ID provided, but SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY missing -> status updates will be skipped."
              echo "has_job_id=false" >> "$GITHUB_ENV"
            else
              echo "has_job_id=true" >> "$GITHUB_ENV"
              echo "✅ JOB_ID: ${JOB_ID}"
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Detect lockfile (for cache + install strategy)
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
            echo "lockfile_path=package-lock.json" >> "$GITHUB_OUTPUT"
          elif [ -f npm-shrinkwrap.json ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
            echo "lockfile_path=npm-shrinkwrap.json" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
            echo "lockfile_path=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f pnpm-lock.yaml ]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
            echo "lockfile_path=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
            echo "lockfile_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node (cache if possible)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.lock.outputs.has_lockfile == 'true' && 'npm' || '' }}
          cache-dependency-path: ${{ steps.lock.outputs.lockfile_path || '' }}

      - name: Install EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Installing EAS CLI ${EAS_CLI_VERSION}..."
          npm install -g "eas-cli@${EAS_CLI_VERSION}"
          eas --version

      - name: Install dependencies (frozen if possible)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.lock.outputs.has_lockfile }}" = "true" ]; then
            echo "Using npm ci (lockfile: ${{ steps.lock.outputs.lockfile_path }})"
            npm ci --no-audit --no-fund
          else
            echo "::warning::No lockfile found in repo. Falling back to npm install (non-reproducible)."
            npm install --no-audit --no-fund
          fi

      - name: CI config sanity (non-prod builds)
        shell: bash
        run: |
          set -euo pipefail
          echo "🧰 CI config sanity..."

          # 1) Avoid future EAS warning: ensure cli.appVersionSource is set.
          node - <<'NODE'
          const fs = require('fs');
          const path = 'eas.json';
          if (!fs.existsSync(path)) process.exit(0);
          const data = JSON.parse(fs.readFileSync(path,'utf8'));
          data.cli = data.cli || {};
          if (!data.cli.appVersionSource) data.cli.appVersionSource = 'remote';
          fs.writeFileSync(path, JSON.stringify(data,null,2)+"\n");
          NODE

          # 2) For development/preview builds in CI we recommend unsigned/internal builds.
          #    This prevents first-time failures due to missing Android Keystore in non-interactive mode.
          if [ "${PROFILE}" != "production" ]; then
            node - <<'NODE'
            const fs = require('fs');
            const p = 'eas.json';
            if (!fs.existsSync(p)) process.exit(0);
            const j = JSON.parse(fs.readFileSync(p,'utf8'));
            j.build = j.build || {};
            const prof = process.env.PROFILE;
            j.build[prof] = j.build[prof] || {};
            j.build[prof].android = j.build[prof].android || {};
            if (j.build[prof].android.withoutCredentials !== true) {
              j.build[prof].android.withoutCredentials = true;
            }
            fs.writeFileSync(p, JSON.stringify(j,null,2)+"\n");
            NODE
          fi

      - name: Self-heal repo (lockfile + dev-client) [commit back]
        shell: bash
        env:
          TARGET_BRANCH: ${{ env.CHECKOUT_REF }}
        run: |
          set -euo pipefail
          echo "🧯 Self-heal: ensure lockfile + expo-dev-client (if development)."

          if [ ! -f package-lock.json ]; then
            echo "📌 Generating package-lock.json..."
            npm install --package-lock-only --no-audit --no-fund
          fi

          if [ "${PROFILE}" = "development" ]; then
            echo "📦 Ensuring expo-dev-client for development builds..."
            # best effort; if it's already installed, expo will be happy
            npx --yes expo install expo-dev-client || true
          fi

          # Commit back only if relevant files changed
          CHANGED=false
          for f in package.json package-lock.json .npmrc eas.json; do
            if git status --porcelain -- "$f" | grep -q .; then CHANGED=true; fi
          done

          if [ "$CHANGED" = "true" ]; then
            echo "✅ Changes detected -> committing back to repo."
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add package.json package-lock.json .npmrc eas.json 2>/dev/null || true
            git commit -m "chore(ci): self-heal lockfile/dev-client" || true
            BR="${TARGET_BRANCH:-}"
            if [ -z "$BR" ]; then BR="$(git rev-parse --abbrev-ref HEAD)"; fi
            echo "🚀 Pushing to origin $BR (best effort)..."
            git push origin "HEAD:$BR" || echo "::warning::Could not push self-heal commit (branch may be protected or ref is not a branch)."
          else
            echo "ℹ️ No relevant changes to commit."
          fi

      - name: Ensure EAS project (project:init)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f eas-project.json ]; then
            echo "📌 No eas-project.json -> running eas project:init (non-interactive)."
            eas project:init --non-interactive
          else
            echo "✅ eas-project.json exists."
          fi

      - name: Run EAS Build (WAIT)
        id: eas
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 Starting EAS build (android, profile=${PROFILE}) with --wait..."

          BUILD_OUTPUT="$(eas build \
            --platform android \
            --profile "${PROFILE}" \
            --non-interactive \
            --wait \
            2>&1)" || {
              CODE=$?
              echo "${BUILD_OUTPUT}"
              echo "::error::EAS build failed (exit ${CODE})"
              exit "${CODE}"
            }

          echo "${BUILD_OUTPUT}"

          BUILD_ID="$(echo "${BUILD_OUTPUT}" | grep -oE "Build ID:[[:space:]]*[a-fA-F0-9-]+" | head -n1 | awk '{print $3}' || true)"
          if [ -z "${BUILD_ID}" ]; then BUILD_ID="unknown"; fi
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"

          BUILD_URL="$(echo "${BUILD_OUTPUT}" | grep -oE "https?://[^[:space:]]+" | grep -E "/projects/[^/]+/builds/[a-fA-F0-9-]+" | head -n1 || true)"
          echo "build_url=${BUILD_URL}" >> "${GITHUB_OUTPUT}"

      - name: Download Android Artifact
        if: ${{ steps.eas.outputs.build_id != 'unknown' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          echo "⬇️ Attempting to download artifact..."
          eas build:download --platform android --id "${{ steps.eas.outputs.build_id }}" --output "build/app.${ARTIFACT_EXT}" || true

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: k1w1-android-${{ env.PROFILE }}-${{ github.run_number }}
          path: build/*
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Triggered Build Summary

          - Repo: ${{ github.repository }}
          - Event: ${{ github.event_name }}
          - Checkout ref: ${CHECKOUT_REF}
          - Profile: ${PROFILE}
          - Checked out: $(git rev-parse HEAD)
          - Lockfile present: ${{ steps.lock.outputs.has_lockfile }}
          - Lockfile path: ${{ steps.lock.outputs.lockfile_path }}
          - EAS CLI: $(eas --version 2>/dev/null || echo "unknown")
          - Build ID: ${{ steps.eas.outputs.build_id }}
          - Build URL: ${{ steps.eas.outputs.build_url }}

          Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
