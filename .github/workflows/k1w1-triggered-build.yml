name: K1W1 Triggered Build

on:
  repository_dispatch:
    types: [trigger-eas-build]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Ref to build (e.g. work, main, dev, feature-x)"
        required: false
        default: "main"
      profile:
        description: "EAS build profile (development|preview|production)"
        required: false
        default: "preview"
      job_id:
        description: "Optional build_jobs id to update in Supabase"
        required: false
        default: ""

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-
    ${{ github.event.client_payload.branch || github.event.client_payload.ref || inputs.ref || github.ref_name }}-
    ${{ github.event.client_payload.build_profile || github.event.client_payload.buildProfile || inputs.profile || 'preview' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EAS_CLI_VERSION: "16.32.0"
  ARTIFACT_EXT: "apk"
  ARTIFACT_MIME: "application/vnd.android.package-archive"
  ALLOWED_REF_REGEX: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$"

jobs:
  autofix:
    name: Autofix (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Determine checkout ref
  id: pick_ref
  uses: ./.github/actions/determine-ref
  with:
    payload_branch: ${{ github.event.client_payload.branch }}
    payload_ref: ${{ github.event.client_payload.ref }}
    input_ref: ${{ github.event.inputs.ref || inputs.ref }}
    github_ref_name: ${{ github.ref_name }}
    default_ref: "work"
    allowed_ref_regex: ${{ env.ALLOWED_REF_REGEX }}

- name: Export CHECKOUT_REF
  shell: bash
  run: |
    set -euo pipefail
    echo "CHECKOUT_REF=${{ steps.pick_ref.outputs.checkout_ref }}" >> "$GITHUB_ENV"
    echo "CHECKOUT_REF=${{ steps.pick_ref.outputs.checkout_ref }}"

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies (robust)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            echo "Using npm ci..."
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed - trying legacy-peer-deps..."
            npm ci --legacy-peer-deps
            exit 0
          fi

          echo "No package-lock.json, using npm install..."
          if npm install; then
            exit 0
          fi
          echo "npm install failed - trying legacy-peer-deps..."
          npm install --legacy-peer-deps

      - name: Lint + Typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint:ci

      - name: Commit autofix (if any)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ci): autofix templates / lint"
          git push

  build:
    name: Build Android Artifact (EAS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_APK_BUCKET: ${{ secrets.SUPABASE_APK_BUCKET }}
      JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id || '' }}

    steps:
      - name: Determine checkout ref
  id: pick_ref
  uses: ./.github/actions/determine-ref
  with:
    payload_branch: ${{ github.event.client_payload.branch }}
    payload_ref: ${{ github.event.client_payload.ref }}
    input_ref: ${{ github.event.inputs.ref || inputs.ref }}
    github_ref_name: ${{ github.ref_name }}
    default_ref: "work"
    allowed_ref_regex: ${{ env.ALLOWED_REF_REGEX }}

- name: Export CHECKOUT_REF
  shell: bash
  run: |
    set -euo pipefail
    echo "CHECKOUT_REF=${{ steps.pick_ref.outputs.checkout_ref }}" >> "$GITHUB_ENV"
    echo "CHECKOUT_REF=${{ steps.pick_ref.outputs.checkout_ref }}"

      - name: Validate JOB_ID
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JOB_ID:-}" ] && ! [[ "$JOB_ID" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Invalid JOB_ID from payload; clearing"
            echo "JOB_ID=" >> "$GITHUB_ENV"
          fi

      - name: Determine build profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ github.event.client_payload.build_profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="${{ github.event.client_payload.buildProfile }}"; fi
          if [ -z "$PROFILE" ]; then PROFILE="${{ github.event.inputs.profile }}"; fi
          if [ -z "$PROFILE" ]; then PROFILE="preview"; fi

          case "$PROFILE" in
            development|preview|production) ;;
            *) echo "Invalid profile: $PROFILE"; exit 1 ;;
          esac

          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "PROFILE=$PROFILE"

      - name: Upload Artifacts (APK + EAS log)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb0d8b62a3 # v4.6.0
        with:
          name: android-${{ github.repository }}-${{ env.CHECKOUT_REF }}-${{ env.PROFILE }}-${{ github.run_id }}
          path: |
            build/*
            /tmp/eas_build.log

      - name: "Update Supabase job: success"
        if: ${{ success() && env.JOB_ID != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, subprocess
          url=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          job=os.environ["JOB_ID"]
          body={"status":"succeeded"}
          du=os.environ.get("DOWNLOAD_URL","").strip()
          if du:
            body["download_url"]=du
          bid=os.environ.get("EAS_BUILD_ID","").strip()
          if bid:
            body["eas_build_id"]=bid
          an=os.environ.get("ARTIFACT_NAME","").strip()
          if an:
            body["artifact_name"]=an
          sh=os.environ.get("ARTIFACT_SHA256","").strip()
          if sh:
            body["artifact_sha256"]=sh
          sz=os.environ.get("ARTIFACT_SIZE","").strip()
          if sz.isdigit():
            body["artifact_size"]=int(sz)
          bu=os.environ.get("EAS_BUILD_URL","").strip()
          if bu:
            body["build_url"]=bu
          subprocess.check_call([
            "curl","-fsS","-X","PATCH",f"{url}/rest/v1/build_jobs?id=eq.{job}",
            "-H",f"apikey: {key}",
            "-H",f"Authorization: Bearer {key}",
            "-H","Content-Type: application/json",
            "-H","Prefer: return=minimal",
            "--data",json.dumps(body)
          ])
          PY

      - name: "Update Supabase job: failure"
        if: ${{ failure() && env.JOB_ID != '' && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, subprocess, pathlib
          url=os.environ["SUPABASE_URL"].rstrip("/")
          key=os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          job=os.environ["JOB_ID"]
          log_path=pathlib.Path("/tmp/eas_build.log")
          log=""
          if log_path.exists():
            log=log_path.read_text(errors="ignore")[-5000:]
          body={"status":"failed","error_message":log}
          bu=os.environ.get("EAS_BUILD_URL","").strip()
          if bu:
            body["build_url"]=bu
          subprocess.check_call([
            "curl","-fsS","-X","PATCH",f"{url}/rest/v1/build_jobs?id=eq.{job}",
            "-H",f"apikey: {key}",
            "-H",f"Authorization: Bearer {key}",
            "-H","Content-Type: application/json",
            "-H","Prefer: return=minimal",
            "--data",json.dumps(body)
          ])
          PY

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Build Summary ==="
          echo "- Repo: ${GITHUB_REPOSITORY}"
          echo "- Checkout ref: ${CHECKOUT_REF}"
          echo "- Profile: ${PROFILE}"
          echo "- Run ID: ${GITHUB_RUN_ID}"
          echo "- EAS Build URL: ${EAS_BUILD_URL:-}"
          echo "- EAS Build ID: ${EAS_BUILD_ID:-}"