name: K1W1 Triggered Build

on:
  repository_dispatch:
    types: [trigger-eas-build]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Ref to build (e.g. main, dev, feature-x)"
        required: false
        default: "main"
      profile:
        description: "EAS build profile (development|preview|production)"
        required: false
        default: "preview"
      job_id:
        description: "Supabase build job id"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: EAS Build (Android, WAIT)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      JOB_ID: ${{ github.event.client_payload.job_id || github.event.inputs.job_id || '' }}

    steps:
      - name: Determine checkout ref
        shell: bash
        run: |
          set -euo pipefail

          REF="${{ github.event.client_payload.branch }}"
          if [ -z "$REF" ]; then REF="${{ github.event.client_payload.ref }}"; fi
          if [ -z "$REF" ]; then REF="${{ github.event.inputs.ref }}"; fi

          if [ -z "$REF" ]; then
            echo "::warning::No branch/ref provided. Falling back to 'main'."
            REF="main"
          fi

          echo "CHECKOUT_REF=$REF" >> "$GITHUB_ENV"
          echo "📌 Checkout ref: $REF"

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Determine build profile
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="${{ github.event.client_payload.build_profile }}"
          if [ -z "$PROFILE" ]; then PROFILE="${{ github.event.client_payload.buildProfile }}"; fi
          if [ -z "$PROFILE" ]; then PROFILE="${{ github.event.inputs.profile }}"; fi
          if [ -z "$PROFILE" ]; then PROFILE="preview"; fi

          if [[ ! "$PROFILE" =~ ^(development|preview|production)$ ]]; then
            echo "::warning::Invalid PROFILE='$PROFILE', defaulting to preview"
            PROFILE="preview"
          fi

          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "✅ Using build profile: $PROFILE"
      - name: Validate profile input
        shell: bash
        run: |
          set -euo pipefail
          case "${PROFILE}" in
            development|preview|production) ;;
            *)
              echo "::error::Invalid profile: '${PROFILE}' (allowed: development|preview|production)"
              exit 1
              ;;
          esac

      - name: Validate Job ID
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${JOB_ID}" ]; then
            echo "has_job_id=false" >> "$GITHUB_ENV"
            echo "⚠️ No JOB_ID provided -> Supabase status updates will be skipped."
          else
            echo "has_job_id=true" >> "$GITHUB_ENV"
            echo "✅ JOB_ID: ${JOB_ID}"
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Ensure EXPO_TOKEN exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi
          echo "✅ EXPO_TOKEN secret is set"

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8 (8.2.1)
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: true
          eas-cache: true

      - name: Verify EAS authentication
        shell: bash
        run: |
          set -euo pipefail
          eas --version
          eas whoami

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Update Build Status - Building
        if: env.has_job_id == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="${{ github.run_id }}"

          JSON="$(printf '{"status":"building","build_profile":"%s","github_run_id":"%s","started_at":"%s"}' "${PROFILE}" "${RUN_ID}" "${TS}")"

          curl --fail-with-body --silent --show-error \
            -X PATCH "${SUPABASE_URL}/rest/v1/build_jobs?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "${JSON}" \
            || echo "::warning::Failed to update Supabase status (building)"

      - name: Run EAS Build (WAIT)
        id: eas
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 Starting EAS build (android, profile=${PROFILE}) with --wait..."

          BUILD_OUTPUT="$(eas build \
            --platform android \
            --profile "${PROFILE}" \
            --non-interactive \
            --wait \
            2>&1)" || {
              CODE=$?
              echo "${BUILD_OUTPUT}"
              echo "::error::EAS build failed (exit ${CODE})"
              exit "${CODE}"
            }

          echo "${BUILD_OUTPUT}"

          BUILD_ID="$(echo "${BUILD_OUTPUT}" | grep -oE 'Build ID:[[:space:]]*[a-fA-F0-9-]+' | head -n1 | awk '{print $3}' || true)"
          if [ -z "${BUILD_ID}" ]; then BUILD_ID="unknown"; fi
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"
          echo "✅ Build ID: ${BUILD_ID}"

          BUILD_URL="$(echo "${BUILD_OUTPUT}" | grep -oE 'https://expo\.dev/accounts/[^/]+/projects/[^/]+/builds/[a-fA-F0-9-]+' | head -n1 || true)"
          echo "build_url=${BUILD_URL}" >> "${GITHUB_OUTPUT}"
          if [ -n "${BUILD_URL}" ]; then echo "🔗 Build URL: ${BUILD_URL}"; fi

      - name: Download Android Artifact (APK)
        if: steps.eas.outputs.build_id != 'unknown' && steps.eas.outputs.build_id != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          echo "📦 Downloading APK for build: ${{ steps.eas.outputs.build_id }}"
          eas build:download \
            --id "${{ steps.eas.outputs.build_id }}" \
            --output "build/k1w1-${PROFILE}.apk" || {
              echo "::warning::Failed to download APK"
              exit 0
            }
          ls -lah build || true

      - name: Upload Android Artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: k1w1-android-${{ env.PROFILE }}-${{ github.run_number }}
          path: build/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Update Build Status - Success
        if: success() && env.has_job_id == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="${{ github.run_id }}"
          BUILD_ID="${{ steps.eas.outputs.build_id }}"
          BUILD_URL="${{ steps.eas.outputs.build_url }}"

          JSON="$(printf '{"status":"completed","github_run_id":"%s","eas_build_id":"%s","build_url":"%s","completed_at":"%s"}' "${RUN_ID}" "${BUILD_ID}" "${BUILD_URL}" "${TS}")"

          curl --fail-with-body --silent --show-error \
            -X PATCH "${SUPABASE_URL}/rest/v1/build_jobs?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "${JSON}" \
            || echo "::warning::Failed to update Supabase status (success)"

      - name: Update Build Status - Failed
        if: failure() && env.has_job_id == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          RUN_ID="${{ github.run_id }}"
          ERR="Build failed. Check logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          JSON="$(printf '{"status":"error","github_run_id":"%s","error_message":"%s","completed_at":"%s"}' "${RUN_ID}" "${ERR}" "${TS}")"

          curl --fail-with-body --silent --show-error \
            -X PATCH "${SUPABASE_URL}/rest/v1/build_jobs?id=eq.${JOB_ID}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "${JSON}" \
            || echo "::warning::Failed to update Supabase status (failed)"
