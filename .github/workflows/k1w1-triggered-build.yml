name: EAS Build (Android, WAIT)

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Git ref (branch/tag/SHA)"
        required: false
        default: "main"
      profile:
        description: "EAS profile (development|preview|production)"
        required: false
        default: "development"
      target_branch:
        description: "Branch to push self-heal commits to (optional)"
        required: false
        default: "main"

permissions:
  contents: write
  metadata: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Determine inputs
        shell: bash
        run: |
          set -euo pipefail

          # repository_dispatch payload wins, workflow_dispatch inputs are fallback
          REF="${{ github.event.client_payload.checkout_ref || github.event.client_payload.ref || inputs.checkout_ref || 'main' }}"
          PROFILE="${{ github.event.client_payload.profile || inputs.profile || 'development' }}"
          TARGET_BRANCH="${{ github.event.client_payload.target_branch || inputs.target_branch || 'main' }}"
          JOB_ID="${{ github.event.client_payload.job_id || '' }}"

          # sanitize profile
          case "$PROFILE" in
            development|preview|production) ;;
            *) echo "::warning::Invalid PROFILE='$PROFILE' -> defaulting to preview"; PROFILE="preview" ;;
          esac

          if [ "$PROFILE" = "production" ]; then EXT="aab"; else EXT="apk"; fi

          echo "CHECKOUT_REF=$REF" >> "$GITHUB_ENV"
          echo "PROFILE=$PROFILE" >> "$GITHUB_ENV"
          echo "ARTIFACT_EXT=$EXT" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

          echo "📌 Checkout ref: $REF"
          echo "✅ Profile: $PROFILE (artifact: .$EXT)"
          echo "➡️ Target branch: $TARGET_BRANCH"

      - name: Validate secrets
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Using npm ci (lockfile present)"
            npm ci --no-audit --no-fund
          else
            echo "::warning::No lockfile found -> npm install (non-reproducible)"
            npm install --no-audit --no-fund
          fi

      - name: Self-heal lockfile + dev-client (development only)
        shell: bash
        run: |
          set -euo pipefail
          echo "🧯 Self-heal: ensure lockfile + expo-dev-client (if development)."

          if [ "${PROFILE}" = "development" ]; then
            echo "📦 Ensuring expo-dev-client is installed..."
            node -e "require.resolve('expo-dev-client/package.json'); console.log('ok')" >/dev/null 2>&1 || npm install --no-audit --no-fund expo-dev-client
          fi

          # Force lockfile generation even if .npmrc disables it
          if [ ! -f package-lock.json ]; then
            echo "📌 Generating package-lock.json..."
            NPM_CONFIG_PACKAGE_LOCK=true npm install --package-lock-only --no-audit --no-fund
          fi

          # Commit back (best effort)
          if git status --porcelain | grep -qE '^( M|\?\?) (package\.json|package-lock\.json|\.npmrc)$'; then
            echo "✅ Changes detected -> committing back to repo."
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add package.json package-lock.json .npmrc 2>/dev/null || true
            git commit -m "chore(ci): self-heal lockfile/dev-client" || true
            echo "🚀 Pushing to origin ${TARGET_BRANCH} (best effort)..."
            git push origin "HEAD:${TARGET_BRANCH}" || echo "::warning::Could not push self-heal commit (branch may be protected)."
          else
            echo "ℹ️ No relevant changes to commit."
          fi

      - name: Remove broken native dirs (if present)
        shell: bash
        run: |
          set -euo pipefail

          # If native folders exist but are incomplete, EAS treats it as a "bare" project and fails hard.
          if [ -d android ]; then
            if [ ! -f android/app/build.gradle ] || [ ! -f android/build.gradle ]; then
              echo "::warning::Detected incomplete android/ directory -> removing it for managed EAS build."
              rm -rf android
            fi
          fi

          if [ -d ios ]; then
            if [ ! -f ios/Podfile ] && [ ! -f ios/Podfile.lock ]; then
              echo "::warning::Detected incomplete ios/ directory -> removing it for managed EAS build."
              rm -rf ios
            fi
          fi

      - name: Setup Java (for keystore generation)
        if: env.PROFILE != 'production'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare local Android signing (non-production)
        if: env.PROFILE != 'production'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .eas/credentials
          KEYSTORE_PATH=".eas/credentials/android.keystore"

          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "🔐 Generating debug-like keystore for non-production builds..."
            keytool -genkeypair \
              -storetype JKS \
              -keystore "$KEYSTORE_PATH" \
              -storepass "android" \
              -keypass "android" \
              -alias "androiddebugkey" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Patch/ensure eas.json: use local credentials for android in non-production, and keep artifact as apk.
          node - <<'NODE'
          const fs = require('fs');

          const file = 'eas.json';
          let eas = {};
          if (fs.existsSync(file)) {
            eas = JSON.parse(fs.readFileSync(file, 'utf8'));
          }

          eas.cli = eas.cli || {};
          eas.cli.appVersionSource = eas.cli.appVersionSource || 'remote';

          eas.build = eas.build || {};
          for (const profile of ['development', 'preview']) {
            eas.build[profile] = eas.build[profile] || {};
            eas.build[profile].android = eas.build[profile].android || {};
            eas.build[profile].android.buildType = 'apk';
            eas.build[profile].android.credentialsSource = 'local';
            eas.build[profile].android.keystore = {
              keystorePath: '.eas/credentials/android.keystore',
              keystorePassword: 'android',
              keyAlias: 'androiddebugkey',
              keyPassword: 'android',
            };
          }

          fs.writeFileSync(file, JSON.stringify(eas, null, 2) + '\n');
          console.log('✅ Patched eas.json for local signing (non-production).');
          NODE

          echo "✅ Local signing prepared."

      - name: Install EAS CLI
        shell: bash
        run: |
          set -euo pipefail
          VER="${EAS_CLI_VERSION:-16.32.0}"
          echo "Installing eas-cli@${VER} ..."
          npm install -g "eas-cli@${VER}"
          eas --version

      - name: Run EAS build (WAIT)
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${PROFILE}" = "production" ]; then
            echo "::error::Production builds are blocked in CI (safety). Use EAS dashboard or local machine for production signing."
            exit 1
          fi

          echo "🚀 Starting EAS build (android, profile=${PROFILE}) with --wait..."
          BUILD_OUTPUT="$(eas build --platform android --profile "${PROFILE}" --non-interactive --wait 2>&1)" || {
            CODE=$?
            echo "${BUILD_OUTPUT}"
            echo "::error::EAS build failed (exit ${CODE})"
            exit "${CODE}"
          }

          echo "${BUILD_OUTPUT}"

          BUILD_ID="$(echo "${BUILD_OUTPUT}" | grep -oE "Build ID:[[:space:]]*[a-fA-F0-9-]+" | head -n1 | awk '{print $3}' || true)"
          if [ -z "${BUILD_ID}" ]; then BUILD_ID="unknown"; fi

          BUILD_URL="$(echo "${BUILD_OUTPUT}" | grep -oE "https?://[^[:space:]]+" | grep -E "/projects/[^/]+/builds/[a-fA-F0-9-]+" | head -n1 || true)"

          mkdir -p build
          {
            echo "build_id=${BUILD_ID}"
            echo "build_url=${BUILD_URL}"
            echo "profile=${PROFILE}"
            echo "ref=${CHECKOUT_REF}"
          } > build/eas-build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: k1w1-android-${{ env.PROFILE }}
          path: build/eas-build-info.txt
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="$(grep '^build_id=' build/eas-build-info.txt | cut -d= -f2-)"
          BUILD_URL="$(grep '^build_url=' build/eas-build-info.txt | cut -d= -f2-)"
          {
            echo "## Build Summary"
            echo ""
            echo "- Ref: ${CHECKOUT_REF}"
            echo "- Profile: ${PROFILE}"
            echo "- Build ID: ${BUILD_ID}"
            if [ -n "${BUILD_URL}" ]; then
              echo "- Build URL: ${BUILD_URL}"
            else
              echo "- Build URL: (not detected in CLI output)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
