# managed-by: k1w1
# workflow-version: 405
name: Deploy Supabase (Edge Functions)

run-name: >-
  Supabase deploy • ${{ inputs.ref || github.ref_name }} •
  ${{ (github.event.inputs.deploy_all || 'true') == 'true' && 'all' || (github.event.inputs.function_name || 'single') }}

on:
  push:
    branches: ["main", "work"]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Ref to deploy from (default: work)"
        required: false
        default: "work"
        type: string
      deploy_all:
        description: "Alle Edge Functions deployen (true/false)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      function_name:
        description: "Einzelne Edge Function deployen, wenn deploy_all=false"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      WORKFLOW_VERSION: "405"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.x

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing SUPABASE_PROJECT_REF secret"
            exit 1
          fi

      - name: Install Supabase CLI (pinned)
        shell: bash
        run: |
          set -euo pipefail
          npm i -g supabase@2.72.7
          supabase --version

      - name: Login + Link project
        shell: bash
        run: |
          set -euo pipefail
          supabase login --token "${SUPABASE_ACCESS_TOKEN}"
          supabase link --project-ref "${SUPABASE_PROJECT_REF}" --workdir supabase

      - name: Deploy Edge Functions
        shell: bash
        env:
          DEPLOY_ALL: ${{ github.event.inputs.deploy_all || 'true' }}
          FUNCTION_NAME_INPUT: ${{ github.event.inputs.function_name || '' }}
        run: |
          set -euo pipefail
          cd supabase

          FUNCTION_NAME="$(printf '%s' "${FUNCTION_NAME_INPUT:-}" | tr -d '\r\n')"

          if [ "$DEPLOY_ALL" = "true" ]; then
            echo "Deploying all functions..."
            # deploy everything (skip _shared)
            for d in functions/*; do
              name="$(basename "$d")"
              if [ -d "$d" ] && [ "$name" != "_shared" ]; then
                echo "-> $name"
                supabase functions deploy "$name"
              fi
            done
            exit 0
          fi

          if [ -z "$FUNCTION_NAME" ]; then
            echo "deploy_all=false and no function_name provided -> nothing to deploy automatically"
            exit 0
          fi

          if ! [[ "$FUNCTION_NAME" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid function_name: $FUNCTION_NAME"
            exit 1
          fi

          if [ "$FUNCTION_NAME" = "_shared" ]; then
            echo "::error::Refusing to deploy reserved helper directory: _shared"
            exit 1
          fi

          if [ ! -d "functions/$FUNCTION_NAME" ]; then
            echo "::error::Function directory not found: functions/$FUNCTION_NAME"
            exit 1
          fi

          echo "Deploying single function: $FUNCTION_NAME"
          supabase functions deploy "$FUNCTION_NAME"

      - name: Write deploy metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            echo "workflow_version=${WORKFLOW_VERSION}"
            echo "ref=${{ inputs.ref || github.ref_name }}"
            echo "deploy_all=${{ github.event.inputs.deploy_all || 'true' }}"
            echo "function_name=${{ github.event.inputs.function_name || '' }}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_sha=${GITHUB_SHA}"
          } > ci-logs/deploy-metadata.env

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase Deploy"
            echo ""
            echo "- workflow version: `${WORKFLOW_VERSION}`"
            echo "- ref: `${{ inputs.ref || github.ref_name }}`"
            echo "- deploy_all: `${{ github.event.inputs.deploy_all || 'true' }}`"
            echo "- function_name: `${{ github.event.inputs.function_name || '' }}`"
            echo "- run id: `${GITHUB_RUN_ID}` / attempt `${GITHUB_RUN_ATTEMPT}`"
            echo "- sha: `${GITHUB_SHA}`"
            echo ""
            echo "Artifacts:"
            echo "- `ci-logs/deploy-metadata.env`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deploy metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supabase-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-logs/deploy-metadata.env
          retention-days: 7
          if-no-files-found: ignore
