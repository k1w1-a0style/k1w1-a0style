# managed-by: k1w1
# workflow-version: 405
name: Deploy Supabase (Edge Functions)

run-name: >-
  Supabase deploy • ${{ inputs.ref }} •
  ${{ (inputs.deploy_all || 'true') == 'true' && 'all' || (inputs.function_name || 'single') }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Ref to deploy from"
        required: true
        type: string
      deploy_all:
        description: "Alle Edge Functions deployen (true/false)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      function_name:
        description: "Einzelne Edge Function deployen, wenn deploy_all=false"
        required: false
        default: ""
        type: string
      apply_migrations:
        description: "DB-Migrations anwenden (auto|true|false)"
        required: false
        default: "auto"
        type: choice
        options: ["auto", "true", "false"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      WORKFLOW_VERSION: "412"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: 20.x

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Missing SUPABASE_PROJECT_REF secret"
            exit 1
          fi

      - name: Install Supabase CLI (pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-bin"
          cat > "$RUNNER_TEMP/supabase-bin/supabase" <<'SH'
          #!/usr/bin/env bash
          exec npx -y supabase@2.72.7 "$@"
          SH
          chmod +x "$RUNNER_TEMP/supabase-bin/supabase"
          echo "$RUNNER_TEMP/supabase-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/supabase-bin/supabase" --version

      - name: Login + Link project
        shell: bash
        run: |
          set -euo pipefail
          supabase login --token "${SUPABASE_ACCESS_TOKEN}"
          supabase link --project-ref "${SUPABASE_PROJECT_REF}"
          supabase link --project-ref "${SUPABASE_PROJECT_REF}" --workdir supabase

      - name: Validate / sanitize dispatch inputs
        id: sanitize_inputs
        shell: bash
        env:
          RAW_REF: ${{ inputs.ref }}
          RAW_DEPLOY_ALL: ${{ inputs.deploy_all || 'true' }}
          RAW_FUNCTION_NAME: ${{ inputs.function_name || '' }}
          RAW_APPLY_MIGRATIONS: ${{ inputs.apply_migrations || 'auto' }}
        run: |
          set -euo pipefail

          REF_INPUT="$(printf '%s' "${RAW_REF:-}" | tr -d '\r\n')"
          DEPLOY_ALL_INPUT="$(printf '%s' "${RAW_DEPLOY_ALL:-true}" | tr -d '\r\n')"
          FUNCTION_NAME_INPUT="$(printf '%s' "${RAW_FUNCTION_NAME:-}" | tr -d '\r\n')"
          APPLY_MIGRATIONS_INPUT="$(printf '%s' "${RAW_APPLY_MIGRATIONS:-auto}" | tr -d '\r\n')"

          if [ -z "$REF_INPUT" ]; then
            echo "::error::ref input is required"
            exit 1
          fi
          if printf '%s' "$REF_INPUT" | LC_ALL=C grep -q '[[:cntrl:]]'; then
            echo "::error::Invalid ref input: control characters are not allowed"
            exit 1
          fi
          if ! git check-ref-format --branch "$REF_INPUT" >/dev/null 2>&1; then
            echo "::error::Invalid ref input"
            exit 1
          fi

          case "$DEPLOY_ALL_INPUT" in
            true|false) ;;
            *)
              echo "::error::Invalid deploy_all input: $DEPLOY_ALL_INPUT"
              exit 1
              ;;
          esac

          if [ -n "$FUNCTION_NAME_INPUT" ] && ! [[ "$FUNCTION_NAME_INPUT" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::Invalid function_name input: $FUNCTION_NAME_INPUT"
            exit 1
          fi

          case "$APPLY_MIGRATIONS_INPUT" in
            auto|true|false) ;;
            *)
              echo "::error::Invalid apply_migrations input: $APPLY_MIGRATIONS_INPUT"
              exit 1
              ;;
          esac

          {
            printf 'ref=%s\n' "$REF_INPUT"
            printf 'deploy_all=%s\n' "$DEPLOY_ALL_INPUT"
            printf 'function_name=%s\n' "$FUNCTION_NAME_INPUT"
            printf 'apply_migrations=%s\n' "$APPLY_MIGRATIONS_INPUT"
          } >> "$GITHUB_OUTPUT"

          {
            printf 'DISPATCH_REF=%s\n' "$REF_INPUT"
            printf 'DEPLOY_ALL_SAFE=%s\n' "$DEPLOY_ALL_INPUT"
            printf 'FUNCTION_NAME_SAFE=%s\n' "$FUNCTION_NAME_INPUT"
            printf 'APPLY_MIGRATIONS_INPUT_SAFE=%s\n' "$APPLY_MIGRATIONS_INPUT"
          } >> "$GITHUB_ENV"

      - name: Deploy Edge Functions
        shell: bash
        env:
          DEPLOY_ALL: ${{ steps.sanitize_inputs.outputs.deploy_all }}
          FUNCTION_NAME_INPUT: ${{ steps.sanitize_inputs.outputs.function_name }}
        run: |
          set -euo pipefail
          cd supabase

          FUNCTION_NAME="$(printf '%s' "${FUNCTION_NAME_INPUT:-}" | tr -d '\r\n')"

          if [ "$DEPLOY_ALL" = "true" ]; then
            echo "Deploying all functions..."
            for d in functions/*; do
              name="$(basename "$d")"
              if [ -d "$d" ] && [ "$name" != "_shared" ] && [ "$name" != "test" ]; then
                echo "-> $name"
                supabase functions deploy "$name" --project-ref "${SUPABASE_PROJECT_REF}"
              fi
            done
            exit 0
          fi

          if [ -z "$FUNCTION_NAME" ]; then
            echo "deploy_all=false and no function_name provided -> nothing to deploy automatically"
            exit 0
          fi

          if ! [[ "$FUNCTION_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::Invalid function_name: $FUNCTION_NAME"
            exit 1
          fi

          if [ "$FUNCTION_NAME" = "_shared" ]; then
            echo "::error::Refusing to deploy reserved helper directory: _shared"
            exit 1
          fi

          if [ "$FUNCTION_NAME" = "test" ]; then
            echo "::error::Refusing to deploy legacy disabled function: test"
            exit 1
          fi

          if [ ! -d "functions/$FUNCTION_NAME" ]; then
            echo "::error::Function directory not found: functions/$FUNCTION_NAME"
            exit 1
          fi

          echo "Deploying single function: $FUNCTION_NAME"
          supabase functions deploy "$FUNCTION_NAME" --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Detect migration changes / policy
        shell: bash
        env:
          APPLY_MIGRATIONS_INPUT: ${{ steps.sanitize_inputs.outputs.apply_migrations }}
        run: |
          set -euo pipefail
          mkdir -p ci-logs

          INPUT="${APPLY_MIGRATIONS_INPUT:-auto}"
          case "$INPUT" in
            auto|true|false) ;;
            *)
              echo "::error::Invalid apply_migrations value: $INPUT"
              exit 1
              ;;
          esac

          APPLIED="false"
          REASON="manual:false"

          if [ "$INPUT" = "true" ]; then
            APPLIED="true"
            REASON="manual:true"
          elif [ "$INPUT" = "false" ]; then
            APPLIED="false"
            REASON="manual:false"
          else
            if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
              if git diff --quiet HEAD^ HEAD -- supabase/migrations; then
                APPLIED="false"
                REASON="auto:no migration changes detected in HEAD"
              else
                APPLIED="true"
                REASON="auto:migration changes detected in HEAD"
              fi
            else
              APPLIED="false"
              REASON="auto:no parent commit available for migration diff"
            fi
          fi

          {
            echo "apply_migrations_input=${INPUT}"
            echo "apply_migrations=${APPLIED}"
            echo "migration_reason=${REASON}"
          } | tee ci-logs/deploy-db-policy.env

          echo "APPLY_MIGRATIONS=${APPLIED}" >> "$GITHUB_ENV"
          echo "MIGRATION_REASON=${REASON}" >> "$GITHUB_ENV"

      - name: Apply DB migrations
        if: env.APPLY_MIGRATIONS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          (
            cd supabase
            supabase db push
          ) 2>&1 | tee ci-logs/db-push.log

      - name: Note skipped DB migrations
        if: env.APPLY_MIGRATIONS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          printf 'DB push skipped: %s\n' "${MIGRATION_REASON:-unknown}" | tee ci-logs/db-push.log

      - name: Write deploy metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          {
            echo "workflow_version=${WORKFLOW_VERSION}"
            echo "ref=${DISPATCH_REF:-unknown}"
            echo "deploy_all=${DEPLOY_ALL_SAFE:-unknown}"
            echo "function_name=${FUNCTION_NAME_SAFE:-}"
            echo "apply_migrations_input=${APPLY_MIGRATIONS_INPUT_SAFE:-unknown}"
            echo "apply_migrations=${APPLY_MIGRATIONS:-false}"
            echo "migration_reason=${MIGRATION_REASON:-unknown}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_sha=${GITHUB_SHA}"
          } > ci-logs/deploy-metadata.env

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Supabase Deploy"
            echo ""
            echo "- workflow version: \`${WORKFLOW_VERSION}\`"
            echo "- ref: \`${DISPATCH_REF:-unknown}\`"
            echo "- deploy_all: \`${DEPLOY_ALL_SAFE:-unknown}\`"
            echo "- function_name: \`${FUNCTION_NAME_SAFE:-}\`"
            echo "- apply_migrations input: \`${APPLY_MIGRATIONS_INPUT_SAFE:-unknown}\`"
            echo "- apply_migrations effective: \`${APPLY_MIGRATIONS:-false}\`"
            echo "- migration reason: \`${MIGRATION_REASON:-unknown}\`"
            echo "- run id: \`${GITHUB_RUN_ID}\` / attempt \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- sha: \`${GITHUB_SHA}\`"
            echo ""
            echo "Artifacts:"
            echo "- \`ci-logs/deploy-metadata.env\`"
            echo "- \`ci-logs/deploy-db-policy.env\`"
            echo "- \`ci-logs/db-push.log\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deploy metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: supabase-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-logs/deploy-metadata.env
            ci-logs/deploy-db-policy.env
            ci-logs/db-push.log
          retention-days: 7
          if-no-files-found: ignore
