name: Workflow Lint (dry)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/check_*.sh"
      - "README.md"
      - "PROJECT_CHECKLOG.md"
      - "docs/INDEX.md"
      - "docs/WORKFLOW_PATCHING.md"
      - "docs/EDGE_FUNCTIONS_STATUS.md"
      - "docs/patches/**"
      - "lib/diagnostics/workflowTemplates.ts"
      - "templates/expo-sdk54-base.json"
  push:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/check_*.sh"
      - "README.md"
      - "PROJECT_CHECKLOG.md"
      - "docs/INDEX.md"
      - "docs/WORKFLOW_PATCHING.md"
      - "docs/EDGE_FUNCTIONS_STATUS.md"
      - "docs/patches/**"
      - "lib/diagnostics/workflowTemplates.ts"
      - "templates/expo-sdk54-base.json"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA to lint"
        required: true
  repository_dispatch:
    types: ["trigger-workflow-lint"]

concurrency:
  group: workflow-lint-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve explicit ref
        id: resolve
        shell: bash
        env:
          RAW_EVENT_NAME: ${{ github.event_name }}
          RAW_PAYLOAD_REF: ${{ github.event.client_payload.ref || '' }}
          RAW_INPUT_REF: ${{ inputs.ref || '' }}
          RAW_GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          REF_SOURCE="github_system"
          if [ "$RAW_EVENT_NAME" = "repository_dispatch" ]; then
            REF="$RAW_PAYLOAD_REF"
            REF_SOURCE="manual"
            if [ -z "$REF" ]; then
              echo "::error::Missing required ref. Pass client_payload.ref for repository_dispatch."
              exit 1
            fi
          elif [ "$RAW_EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$RAW_INPUT_REF"
            REF_SOURCE="manual"
            if [ -z "$REF" ]; then
              echo "::error::Missing required ref. Pass inputs.ref for workflow_dispatch."
              exit 1
            fi
          else
            REF="$RAW_GITHUB_REF"
          fi
          REF="$(printf '%s' "$REF" | tr -d '\r\n')"
          if [ "${#REF}" -gt 200 ]; then
            echo "::error::Invalid ref (too long)."
            exit 1
          fi
          if [[ "$REF" =~ [[:cntrl:]] ]] || [[ "$REF" =~ [[:space:]] ]]; then
            echo "::error::Invalid ref (control/space characters are not allowed)."
            exit 1
          fi
          if [ "$REF_SOURCE" = "manual" ]; then
            if [[ "$REF" == refs/* ]] || [[ "$REF" == -* ]]; then
              echo "::error::Invalid ref (forbidden prefix)."
              exit 1
            fi
            if [[ "$REF" == *..* ]] || [[ "$REF" == *@\{* ]] || [[ "$REF" == *.lock ]]; then
              echo "::error::Invalid ref (forbidden git sequence)."
              exit 1
            fi
            if [[ "$REF" == */ ]] || [[ "$REF" == *//* ]]; then
              echo "::error::Invalid ref (forbidden slash placement)."
              exit 1
            fi
            if [[ "$REF" =~ [:\\~\^\?\*\[] ]]; then
              echo "::error::Invalid ref (forbidden metacharacters)."
              exit 1
            fi
            if [[ ! "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
              echo "::error::Invalid ref (safe policy mismatch)."
              exit 1
            fi
          else
            if [[ ! "$REF" =~ ^refs/(heads/[A-Za-z0-9][A-Za-z0-9._/-]{0,199}|tags/[A-Za-z0-9][A-Za-z0-9._/-]{0,199}|pull/[1-9][0-9]*/merge)$ ]]; then
              echo "::error::Invalid GitHub system ref (allowed: refs/heads/*, refs/tags/*, refs/pull/*/merge)."
              exit 1
            fi
          fi
          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (für Pin-Check Script)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: "20"

      - name: Install actionlint (pinned + checksum-verified)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256_LINUX_AMD64: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl --fail --show-error --silent --location \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors --connect-timeout 10 \
            --output "$archive" \
            "$url"
          printf '%s  %s\n' "$ACTIONLINT_SHA256_LINUX_AMD64" "$archive" | sha256sum --check -
          tar -xzf "$archive" actionlint
          install_dir="${RUNNER_TEMP}/actionlint-bin"
          mkdir -p "$install_dir"
          install -m 0755 actionlint "$install_dir/actionlint"
          rm -f "$archive"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: actionlint (YAML/Actions dry validation)
        run: actionlint -color

      - name: Run workflow guard scripts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_workflow_template_drift.sh
          bash scripts/check_managed_workflows.sh
          bash scripts/check_workflow_edge_contracts.sh
          bash scripts/check_legacy_disabled_edges.sh
          bash scripts/check_patch_docs_sync.sh

      - name: Check actions are SHA pinned
        run: node .github/scripts/check-actions-pinned.mjs
