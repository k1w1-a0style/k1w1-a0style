name: Workflow Lint (dry)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/check_*.sh"
      - "README.md"
      - "PROJECT_CHECKLOG.md"
      - "docs/INDEX.md"
      - "docs/WORKFLOW_PATCHING.md"
      - "docs/EDGE_FUNCTIONS_STATUS.md"
      - "docs/patches/**"
  push:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/check_*.sh"
      - "README.md"
      - "PROJECT_CHECKLOG.md"
      - "docs/INDEX.md"
      - "docs/WORKFLOW_PATCHING.md"
      - "docs/EDGE_FUNCTIONS_STATUS.md"
      - "docs/patches/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA (leer = aktueller Ref)"
        required: false
        default: ""
  repository_dispatch:
    types: ["trigger-workflow-lint"]

concurrency:
  group: workflow-lint-${{ github.event.client_payload.ref || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.client_payload.ref || inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Setup Node.js (für Pin-Check Script)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" | bash -s -- "${ACTIONLINT_VERSION}"
          echo "$PWD" >> "$GITHUB_PATH"

      - name: actionlint (YAML/Actions dry validation)
        run: actionlint -color

      - name: Run workflow guard scripts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_workflow_template_drift.sh
          bash scripts/check_managed_workflows.sh
          bash scripts/check_workflow_edge_contracts.sh
          bash scripts/check_patch_docs_sync.sh

      - name: Check actions are SHA pinned
        run: node .github/scripts/check-actions-pinned.mjs
