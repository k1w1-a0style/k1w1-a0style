name: Workflow Lint (dry)

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/check_*.sh"
      - "README.md"
      - "PROJECT_CHECKLOG.md"
      - "docs/INDEX.md"
      - "docs/WORKFLOW_PATCHING.md"
      - "docs/EDGE_FUNCTIONS_STATUS.md"
      - "docs/patches/**"
      - "lib/diagnostics/workflowTemplates.ts"
      - "templates/expo-sdk54-base.json"
  push:
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/check_*.sh"
      - "README.md"
      - "PROJECT_CHECKLOG.md"
      - "docs/INDEX.md"
      - "docs/WORKFLOW_PATCHING.md"
      - "docs/EDGE_FUNCTIONS_STATUS.md"
      - "docs/patches/**"
      - "lib/diagnostics/workflowTemplates.ts"
      - "templates/expo-sdk54-base.json"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA to lint"
        required: true
  repository_dispatch:
    types: ["trigger-workflow-lint"]

concurrency:
  group: workflow-lint-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve explicit ref
        id: resolve
        shell: bash
        env:
          RAW_EVENT_NAME: ${{ github.event_name }}
          RAW_PAYLOAD_REF: ${{ github.event.client_payload.ref || '' }}
          RAW_INPUT_REF: ${{ inputs.ref || '' }}
          RAW_GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$RAW_EVENT_NAME" = "repository_dispatch" ]; then
            REF="$RAW_PAYLOAD_REF"
            if [ -z "$REF" ]; then
              echo "::error::Missing required ref. Pass client_payload.ref for repository_dispatch."
              exit 1
            fi
          elif [ "$RAW_EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$RAW_INPUT_REF"
            if [ -z "$REF" ]; then
              echo "::error::Missing required ref. Pass inputs.ref for workflow_dispatch."
              exit 1
            fi
          else
            REF="$RAW_GITHUB_REF"
          fi
          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

  lint:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js (für Pin-Check Script)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" | bash -s -- "${ACTIONLINT_VERSION}"
          echo "$PWD" >> "$GITHUB_PATH"

      - name: actionlint (YAML/Actions dry validation)
        run: actionlint -color

      - name: Run workflow guard scripts
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check_workflow_template_drift.sh
          bash scripts/check_managed_workflows.sh
          bash scripts/check_workflow_edge_contracts.sh
          bash scripts/check_legacy_disabled_edges.sh
          bash scripts/check_patch_docs_sync.sh

      - name: Check actions are SHA pinned
        run: node .github/scripts/check-actions-pinned.mjs
