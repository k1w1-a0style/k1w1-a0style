name: Release Build (WAIT)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        type: choice
        options: [production, preview, development]
        default: production

jobs:
  build:
    name: Android Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS CLI
        run: |
          set -euo pipefail
          npm i -g eas-cli
          eas --version

      - name: Authenticate with Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Missing EXPO_TOKEN secret"
            exit 1
          fi
          eas whoami

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run EAS build (WAIT)
        id: eas
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 Starting EAS build (platform=android, profile=${{ inputs.profile }}) with --wait..."

          BUILD_OUTPUT="$(eas build             --platform android             --profile "${{ inputs.profile }}"             --non-interactive             --wait             2>&1)" || {
              CODE=$?
              echo "${BUILD_OUTPUT}"
              echo "::error::EAS build failed (exit ${CODE})"
              exit "${CODE}"
            }

          echo "${BUILD_OUTPUT}"

          BUILD_ID="$(echo "${BUILD_OUTPUT}" | grep -oP 'Build ID:\s*\K[a-fA-F0-9-]+' | head -n1 || true)"
          if [ -z "${BUILD_ID}" ]; then BUILD_ID="unknown"; fi
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"
          echo "✅ Build ID: ${BUILD_ID}"

          BUILD_URL="$(echo "${BUILD_OUTPUT}" | grep -oP 'https?://[^\s]+' | grep -E '/projects/[^/]+/builds/[a-fA-F0-9-]+' | head -n1 || true)"
          echo "build_url=${BUILD_URL}" >> "${GITHUB_OUTPUT}"
          if [ -n "${BUILD_URL}" ]; then echo "🔗 Build URL: ${BUILD_URL}"; fi

      - name: Download Android APK
        if: steps.eas.outputs.build_id != 'unknown' && steps.eas.outputs.build_id != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          eas build:download             --id "${{ steps.eas.outputs.build_id }}"             --output "build/k1w1-${{ inputs.profile }}.apk" || {
              echo "::warning::Failed to download APK"
              exit 0
            }
          ls -lah build || true

      - name: Upload Android Artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: k1w1-android-${{ inputs.profile }}-${{ github.run_number }}
          path: build/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Release Build

          - Platform: android
          - Profile: ${{ inputs.profile }}
          - Build ID: ${{ steps.eas.outputs.build_id }}
          - Build URL: ${{ steps.eas.outputs.build_url }}

          Artifacts (if any): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
