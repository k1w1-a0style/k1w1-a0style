name: Release Build

on:
  # Manual trigger for production builds
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - android
          - ios
          - all
        default: "android"
      profile:
        description: "Build profile from eas.json"
        required: true
        type: choice
        options:
          - production
          - preview
          - development
        default: "production"

jobs:
  build:
    name: Release Build (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Ensure EXPO_TOKEN exists
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Missing GitHub Secret EXPO_TOKEN"
            exit 1
          fi

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: true
          eas-cache: true

      - name: Verify EAS authentication
        shell: bash
        run: |
          set -euo pipefail
          eas --version
          eas whoami

      - name: Install dependencies
        run: npm ci

      - name: Build on EAS (WAIT)
        id: eas
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 Starting EAS build for ${{ inputs.platform }} (${{ inputs.profile }})..."
          echo "📦 Platform: ${{ inputs.platform }}"
          echo "⚙️  Profile: ${{ inputs.profile }}"
          echo ""

          BUILD_OUTPUT="$(eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait \
            2>&1)" || {
              EXIT_CODE=$?
              echo "${BUILD_OUTPUT}"
              echo "::error::❌ Build failed with exit code ${EXIT_CODE}"
              exit ${EXIT_CODE}
            }

          echo "${BUILD_OUTPUT}"

          BUILD_ID="$(echo "${BUILD_OUTPUT}" | grep -oP 'Build ID:\s*\K[a-fA-F0-9-]+' | head -n1 || true)"
          if [ -z "${BUILD_ID}" ]; then BUILD_ID="unknown"; fi
          echo "build_id=${BUILD_ID}" >> "${GITHUB_OUTPUT}"
          echo "✅ Build ID: ${BUILD_ID}"

          BUILD_URL="$(echo "${BUILD_OUTPUT}" | grep -oP 'https://expo\.dev/accounts/[^/]+/projects/[^/]+/builds/[a-fA-F0-9-]+' | head -n1 || true)"
          echo "build_url=${BUILD_URL}" >> "${GITHUB_OUTPUT}"
          echo "🔗 Build URL: ${BUILD_URL}"

          echo "✅ Build completed successfully!"

      - name: Download Android APK
        if: (inputs.platform == 'android' || inputs.platform == 'all') && steps.eas.outputs.build_id != 'unknown' && steps.eas.outputs.build_id != ''
        continue-on-error: true
        run: |
          mkdir -p build
          eas build:download --id ${{ steps.eas.outputs.build_id }} --output build/k1w1-${{ inputs.profile }}.apk

      - name: Upload Android Artifact
        if: inputs.platform == 'android' || inputs.platform == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: k1w1-android-${{ inputs.profile }}-${{ github.run_number }}
          path: build/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release Summary
        run: |
          echo "## 🚀 Release Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform:** ${{ inputs.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** ${{ inputs.profile }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** ${{ steps.eas.outputs.build_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build URL:** ${{ steps.eas.outputs.build_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
