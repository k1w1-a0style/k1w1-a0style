name: CI (App Trigger)

on:
  repository_dispatch:
    types: ["trigger-ci"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA to validate"
        required: true

concurrency:
  group: ci-app-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event_name == 'workflow_dispatch' && inputs.ref || 'missing-ref' }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve explicit ref
        id: resolve
        shell: bash
        env:
          RAW_EVENT_NAME: ${{ github.event_name }}
          RAW_PAYLOAD_REF: ${{ github.event.client_payload.ref || '' }}
          RAW_INPUT_REF: ${{ inputs.ref || '' }}
        run: |
          set -euo pipefail
          REF=""
          if [ "$RAW_EVENT_NAME" = "repository_dispatch" ]; then
            REF="$RAW_PAYLOAD_REF"
          elif [ "$RAW_EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$RAW_INPUT_REF"
          fi
          if [ -z "$REF" ]; then
            echo "::error::Missing required ref. Pass client_payload.ref for repository_dispatch or inputs.ref for workflow_dispatch."
            exit 1
          fi
          REF="$(printf '%s' "$REF" | tr -d '\r\n')"
          if [ "${#REF}" -gt 200 ]; then
            echo "::error::Invalid ref (too long)."
            exit 1
          fi
          if [[ "$REF" =~ [[:cntrl:]] ]] || [[ "$REF" =~ [[:space:]] ]]; then
            echo "::error::Invalid ref (control/space characters are not allowed)."
            exit 1
          fi
          if [[ "$REF" == refs/* ]] || [[ "$REF" == -* ]]; then
            echo "::error::Invalid ref (forbidden prefix)."
            exit 1
          fi
          if [[ "$REF" == *..* ]] || [[ "$REF" == *@\{* ]] || [[ "$REF" == *.lock ]]; then
            echo "::error::Invalid ref (forbidden git sequence)."
            exit 1
          fi
          if [[ "$REF" == */ ]] || [[ "$REF" == *//* ]]; then
            echo "::error::Invalid ref (forbidden slash placement)."
            exit 1
          fi
          if [[ "$REF" =~ [:\\~\^\?\*\[] ]]; then
            echo "::error::Invalid ref (forbidden metacharacters)."
            exit 1
          fi
          if [[ ! "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]; then
            echo "::error::Invalid ref (safe policy mismatch)."
            exit 1
          fi
          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

  ci:
    needs: resolve
    uses: ./.github/workflows/ci-core.yml
    secrets: inherit
    with:
      ref: ${{ needs.resolve.outputs.ref }}
