name: CI (App Trigger)

on:
  repository_dispatch:
    types: ["trigger-ci"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA to validate"
        required: true

concurrency:
  group: ci-app-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.ref || github.event_name == 'workflow_dispatch' && inputs.ref || 'missing-ref' }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve explicit ref
        id: resolve
        shell: bash
        env:
          RAW_EVENT_NAME: ${{ github.event_name }}
          RAW_PAYLOAD_REF: ${{ github.event.client_payload.ref || '' }}
          RAW_INPUT_REF: ${{ inputs.ref || '' }}
        run: |
          set -euo pipefail
          REF=""
          if [ "$RAW_EVENT_NAME" = "repository_dispatch" ]; then
            REF="$RAW_PAYLOAD_REF"
          elif [ "$RAW_EVENT_NAME" = "workflow_dispatch" ]; then
            REF="$RAW_INPUT_REF"
          fi
          if [ -z "$REF" ]; then
            echo "::error::Missing required ref. Pass client_payload.ref for repository_dispatch or inputs.ref for workflow_dispatch."
            exit 1
          fi
          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

  ci:
    needs: resolve
    uses: ./.github/workflows/ci-core.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
