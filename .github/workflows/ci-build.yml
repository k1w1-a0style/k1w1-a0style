name: CI (App Trigger)

on:
  repository_dispatch:
    types: ["trigger-ci"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/Tag/SHA (leer = aktueller Ref)"
        required: false
        default: ""

concurrency:
  group: ci-app-${{ github.event.client_payload.ref || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-core.yml
    with:
      ref: ${{ github.event.client_payload.ref || inputs.ref || github.ref }}
